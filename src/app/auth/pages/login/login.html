<div class="login-container">
  <div class="login-card">

    <h2>Bem-vindo</h2>
    <p class="subtitle">Acesse o sistema de convênios</p>

    <div class="field">
      <label>Email</label>
      <input
        type="email"
        placeholder="seu@email.com"
        [(ngModel)]="email"
      />
    </div>

    <div class="field">
      <label>Senha</label>
      <input
        type="password"
        placeholder="••••••••"
        [(ngModel)]="password"
      />
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button
      (click)="submit()"
      [disabled]="loading"
      class="login-button"
    >
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>

  </div>
</div>

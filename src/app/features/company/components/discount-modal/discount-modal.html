<div class="modal-backdrop">
  <div class="modal">

    <h3>Gerar Desconto</h3>

    <p>
      <strong>Beneficiário:</strong>
      {{ beneficiary.name }}
    </p>

    <p>
      <strong>Data:</strong>
      {{ today | date:'dd/MM/yyyy' }}
    </p>

    <button
      class="primary"
      (click)="calculate()"
      [disabled]="loading"
    >
      {{ loading ? 'Calculando...' : 'Gerar desconto' }}
    </button>

    <div class="result" *ngIf="discount !== undefined">
      <p>Desconto aplicado:</p>
      <strong>{{ discount }}%</strong>

      <button class="success" (click)="confirm()">
        Confirmar
      </button>
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button class="close" (click)="close.emit()">
      Cancelar
    </button>

  </div>
</div>

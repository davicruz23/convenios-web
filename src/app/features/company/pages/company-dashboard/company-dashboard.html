<div class="page">

  <header class="header">
    <div class="header-left">
      <h2 class="company-name">{{ company?.companyName }}</h2>
      <span class="subtitle">Área do Parceiro</span>
    </div>

    <button class="logout-btn" (click)="logout()">
      Sair
    </button>
  </header>

  <main class="main">
    <section class="card">
      <app-beneficiary-search
        (selected)="openDiscountModal($event)">
      </app-beneficiary-search>
    </section>
  </main>

  @if (selectedBeneficiary) {
    <app-discount-modal
      [beneficiary]="selectedBeneficiary"
      (close)="selectedBeneficiary = null">
    </app-discount-modal>
  }

</div>

<div class="page">
  <header class="page-header">
    <h1>Partners</h1>
    <button class="primary">New Partner</button>
  </header>

  @if (partners.length === 0) {
    <p class="empty">No partners found.</p>
  } @else {
    <ul class="partner-list">
      @for (p of partners; track p.id) {
        <li class="partner-card">
          <div>
            <strong>{{ p.name }}</strong>
            @if (!p.isHolder) {
              <span class="tag">Dependent</span>
            }
          </div>

          <small>
            @if (!p.isHolder) {
              Holder: {{ p.holderName }}
            } @else {
              Holder
            }
          </small>
        </li>
      }
    </ul>
  }
</div>
